version: '3.8'

services:

  postgres:
    image: postgres:16-alpine
    container_name: aldaleel-postgres
    environment:
      POSTGRES_DB: aldaleel_inventory       # auto-creates this database on first run
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data  # persist data between restarts
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d aldaleel_inventory"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
